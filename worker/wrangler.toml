# Zeo Dental Clinic — one Worker serves everything on one origin (same shape as fanar):
#   static files   the Vite build in ../dist, from static assets (free, no Worker run)
#   /, /{lang}/*   HTML with per-language SEO tags injected by the Worker
#   /sitemap.xml   generated by the Worker (public/sitemap.xml was removed: it would shadow it)
#   /api/*         booking, chat, receptionist, export API (D1 + R2)
#   /health        health check
#
# Lives in worker/ (not the repo root) because the frontend's vitest 1.x cannot share a
# package with @cloudflare/vitest-pool-workers. Build the site first: `npm run build:site`.
name = "zeo-dental"
main = "src/index.ts"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]
# Serves at https://zeo-dental.<account>.workers.dev until the cutover adds the route below.
workers_dev = true

[observability]
enabled = true

# The chatbot (Workers AI). No API key; model in src/routes/chat.ts, override with AI_MODEL.
[ai]
binding = "AI"

[assets]
directory = "../dist"
binding = "ASSETS"
# A missing file is a 404, never the page. Paths without a file still reach the Worker,
# because the Worker is the fallback when no asset matches.
not_found_handling = "none"
# These paths invoke the Worker even though a file could match ("/" would otherwise
# serve dist/index.html with the English-only tags).
run_worker_first = ["/", "/api/*", "/health", "/sitemap.xml"]

[[d1_databases]]
binding = "DB"
database_name = "zeo-dental"
# PLACEHOLDER — replace with the id printed by (see DEPLOY.md §1):
#   wrangler d1 create zeo-dental --jurisdiction eu      [verify the flag on the free plan]
#   (fallback: wrangler d1 create zeo-dental --location weur)
database_id = "64b4d4ac-d1dc-42f4-b5df-51dcfaeb8fae"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "zeo-dental-uploads"
# The bucket is created with `wrangler r2 bucket create zeo-dental-uploads --jurisdiction eu`.
# A bucket in a jurisdiction is only reachable when the binding names it.   [verify]
jurisdiction = "eu"

# Workers Rate Limiting binding (GA 2025-09). Counts per Cloudflare location, not globally.
# Free-plan availability: [verify]. When the binding is absent the Worker falls back to a
# D1 counter keyed by a daily salted IP hash (table rate_limits), so either way it works.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1001"
simple = { limit = 15, period = 60 }

[[ratelimits]]
name = "BOOKING_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[vars]
ZEO_ENV = "production"
BASE_URL = "https://zeodentalclinic.com"
# Cross-origin callers of the API. The site itself is same-origin and needs none.
CORS_ORIGINS = "https://zeodentalclinic.com,https://www.zeodentalclinic.com"
# Hard daily cap on chat answers (counted from chat_usage). A worst-case answer costs about
# 70 neurons, so 120 stays inside the 10,000 free neurons a day with room for other Workers.
CHAT_DAILY_CAP = "120"
# Per visitor address per UTC day (D1 ring), on top of the global cap.
CHAT_DAILY_PER_IP = "40"
# Deposit links (POK, DEPLOY.md §10). Inert: every deposit endpoint answers 503 until the
# POK_KEY_ID / POK_KEY_SECRET / POK_MERCHANT_ID secrets and AGENT_TOKEN all exist.
DEPOSIT_AMOUNT = "500.00"          # one fixed amount for everyone (owner decision: €500)
DEPOSIT_CURRENCY = "EUR"           # EUR or ALL (POK's SDK: "we support only ALL and EUR")   [verify]
DEPOSIT_EXPIRES_MINUTES = "4320"   # 72 h
POK_ENV = "staging"                # "production" only after a full staging test
# DEPOSIT_TERMS_URL = ""           # optional: the clinic's own deposit-terms page

# Secrets — never in this file. Set each with `wrangler secret put <NAME>` (DEPLOY.md §2):
#   RESEND_API_KEY          new key under a Z.E Resend account (EU region)
#   MAIL_FROM               e.g. "Zeo Dental Clinic <noreply@…>" on a verified Resend domain
#   MAIL_TO                 clinic inbox for new-booking notifications
#   MAIL_TO_PARTNER         optional second recipient
#   ADMIN_TOKEN             receptionist dashboard password / bearer token
#   SHEETS_EXPORT_TOKEN     bearer token for /api/export/* (Apps Script keeps it in Script Properties)
#   RATE_LIMIT_SALT         salt for the D1 rate-limit fallback hash
#   WHATSAPP_PHONE_NUMBER_ID, WHATSAPP_ACCESS_TOKEN   optional; WhatsApp stays off without them
#   POK_KEY_ID, POK_KEY_SECRET, POK_MERCHANT_ID       Zeo Dental's own POK merchant (deposits off without them)
#   AGENT_TOKEN             call-centre /agent password / bearer (≥32 chars, NOT the ADMIN_TOKEN)
# Build-time (frontend, not a Worker secret): VITE_ELFSIGHT_WIDGET_ID in the shell running `npm run build:site`.

# Live since the 2026-10-13 cutover. Rollback: comment these out and redeploy (DEPLOY.md §6).
[[routes]]
pattern = "zeodentalclinic.com/*"
zone_name = "zeodentalclinic.com"
[[routes]]
pattern = "www.zeodentalclinic.com/*"
zone_name = "zeodentalclinic.com"
